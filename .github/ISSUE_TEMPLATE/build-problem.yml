name: Build problem
description: The build fails, or produces something that will not run.
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check section 7 of [docs/SETUP.md](../blob/main/docs/SETUP.md).
        It covers the failures that are expected, and several that look alarming but are not —
        in particular `mac game: 167 built, 1 failed` is a correct build, and the one failure
        is always `src/tlb_manage.c`.

        **Do not attach a ROM, a `base.zip`, or any file generated from them.** That includes
        extracted `.bin` blobs and generated asset `.c` files. Issues carrying that data will
        be deleted. Build logs and error text are fine, and are what is actually useful here.
  - type: textarea
    id: counts
    attributes:
      label: The four build counts
      description: The last lines of `./build_mac.sh all`. Paste them verbatim, even if the build died before reaching them.
      placeholder: |
        mac game: 167 built, 1 failed
        mac assets: 746 built, 0 failed
        mac audio: 40 built, 0 failed
        mac port layer: 23 built, 0 failed
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The error
      description: The first failure, not the last. A wall of undefined symbols usually has one earlier cause.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and architecture
      placeholder: "14.5, arm64 (output of `sw_vers -productVersion` and `uname -m`)"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: SDK
      description: Output of `xcrun -sdk macosx --show-sdk-path`
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: Which steps did you complete?
      options:
        - label: "`tools/fetch-thirdparty.sh fetch` then `verify`, and verify passed"
        - label: "Applied `0001-source.patch` to a fresh decomp clone"
        - label: "ROM in place, and its SHA-1 matches section 3.3"
        - label: "Ran `enable_bg_extraction.py` before extraction"
        - label: "Ran the whole of section 3.5, in order"
        - label: "Ran all five namespacing invocations in section 3.6"
        - label: "Applied `0002-assets.patch` after 3.6, not before"
