name: Build or installation problem
description: The project does not install, build, launch or complete its self-test.
title: "[Build]: "
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Check the troubleshooting section of
        [docs/SETUP.md](https://github.com/seb-patron/goldeneye-native/blob/main/docs/SETUP.md)
        before filing. A successful current build reports `0 failed` in every build phase.

        **Do not attach a ROM, `base.zip`, save file or anything extracted from one.** Do not
        paste their contents or upload generated asset source. Error text and build logs are fine.

        Search existing issues first and use one report for one problem.
  - type: input
    id: commit
    attributes:
      label: Commit tested
      description: Run `git rev-parse --short HEAD` in the repository.
      placeholder: "7a77917"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple silicon
        - macOS Intel
        - Windows x86-64
        - Linux x86-64
        - Linux arm64
        - tvOS or iOS bring-up
        - Android bring-up
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and toolchain details
      description: OS version, architecture, compiler and SDK or distribution version.
      placeholder: "macOS 26.4.1, arm64, Apple clang 21.0.0, SDK 26.5"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Include the command and relevant environment variables, with personal paths removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Build or self-test summary
      description: Paste every phase count or the complete self-test summary that was printed.
      placeholder: |
        mac game: 167 built, 0 failed
        mac assets: 746 built, 0 failed
        mac audio: 40 built, 0 failed
        mac port layer: 67 built, 0 failed
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: First meaningful failure
      description: Include a short excerpt beginning at the first error, not only later follow-on errors.
      render: text
    validations:
      required: true
  - type: textarea
    id: clean_retry
    attributes:
      label: Clean retry and other troubleshooting
      description: Say whether current `main`, a clean build or the setup guide changed the result.
    validations:
      required: true
  - type: checkboxes
    id: data_rules
    attributes:
      label: Game-data check
      options:
        - label: I have not attached a ROM, save, `base.zip` or extracted game data.
          required: true
