name: Gameplay or rendering bug
description: The game builds and runs, but something is wrong in it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the known issues in the [README](../blob/main/README.md) first. Several are listed
        there, and a few things that look like bugs are faithful to the original.

        **If the problem is combat pacing, try `--framerate=30` before filing.** Enemy fire
        rates, ammunition and AI stepping advance once per rendered frame, so at 60 they run
        roughly twice as fast as the console did. 30 runs them at the intended cadence. That
        is a known gap, not something to report again.

        A stage that refuses to load and prints a reason is usually working as intended:
        ten stage ids carry no data in the ROM, and six more are multiplayer-only and need
        `GETV_MP=2`. The message says which.

        **Do not attach a ROM or anything extracted from one.** Screenshots of the running game
        are fine and are usually the fastest way to explain a rendering problem.
  - type: input
    id: stage
    attributes:
      label: Level
      description: The name, and the `GETV_STAGE` value if you booted straight into it.
      placeholder: "Cradle (GETV_STAGE=41)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reach it
      description: Every step from launching the binary. Include any `GETV_*` variables you set.
      render: text
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
