name: Gameplay, configuration or rendering bug
description: The game builds and runs, but its behavior or picture is wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the known limitations in the
        [README](https://github.com/seb-patron/goldeneye-native/blob/main/README.md) and search
        existing issues first. File one problem per report so a fix can remain small and
        independently reviewable.

        **Never include a ROM, ever.** Do not attach, paste, encode, archive or link to one. Do not
        attach `base.zip`, a save file or anything extracted from game data. Screenshots of the
        running game and sanitized logs are useful and are allowed.
  - type: input
    id: commit
    attributes:
      label: Commit tested
      description: Run `git rev-parse --short HEAD` in the repository.
      placeholder: "7a77917"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Platform and hardware
      description: Include OS version, architecture and GPU or device model when relevant.
      placeholder: "macOS 26.4.1, arm64, Apple M5 Max"
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - OpenGL
        - Metal
        - OpenGL ES
        - Not renderer-specific or unknown
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Level or screen
      description: Give the name and `GETV_STAGE` value if one is involved.
      placeholder: "Cuba credits (GETV_STAGE=54)"
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Include profile, player count, config, command-line options and `GETV_*` values.
      render: text
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
      description: Explain the reference behavior and why it is expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction steps
      description: Start from launching the binary and include every input needed to reach the problem.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Intermittent
        - Happened once
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Clean-main or renderer comparison
      description: Say whether it reproduces on current `main`, after a clean build, or in another renderer.
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Add screenshots of the running game or sanitized log evidence. Never upload game data or personal paths.
  - type: textarea
    id: assistance
    attributes:
      label: Report preparation
      description: Optionally name any agent or automated harness that helped prepare the report. Do not paste private reasoning or transcripts.
  - type: checkboxes
    id: data_rules
    attributes:
      label: Game-data check
      options:
        - label: I have not included, attached, pasted, encoded, archived or linked to a ROM, save, `base.zip` or extracted game data.
          required: true
