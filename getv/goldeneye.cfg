# goldeneye.cfg - GoldenEye 007, native macOS port
#
# Lines are  key = value.  '#' and ';' start a comment.
# Precedence: command line  >  GETV_* environment  >  this file  >  defaults.
# An environment variable ALWAYS beats this file, so measurement harnesses that
# export GETV_* keep working exactly as before.

# --- display ---------------------------------------------------------------
resolution  = 1280x960     # WIDTHxHEIGHT (min 320x240), or "fullscreen"
aspect      = 4:3          # 4:3 | 16:9 | auto. Only used if resolution is unset.
fullscreen  = 0
supersample = 1            # 1 or 2. 2 renders at double size and downsamples.
filtering   = three-point  # point | bilinear | three-point (three-point = real N64)

# --- framerate -------------------------------------------------------------
# 30, 50, 60 or off. 120 IS NOT SUPPORTED AND WILL BE REJECTED.
#
# GoldenEye counts time in WHOLE VIDEO FRAMES, not seconds. Fire rates, reload
# times, physics, animation and the mission clock are all integrated once per
# rendered frame. Running at 120 therefore does not make the game smoother - it
# makes the entire game run at DOUBLE SPEED. (30 likewise halves it.) Genuine
# high-refresh support needs the simulation decoupled from rendering, which this
# build does not do yet.
framerate   = 60

# --- controls --------------------------------------------------------------
# All eight of Rare's control styles are selectable:
#   1.1 honey   1.2 solitaire   1.3 kissy    1.4 goodnight   (one controller)
#   2.1 plenty  2.2 galore      2.3 domino   2.4 goodhead    (two controllers)
# 2.2 galore and 2.4 goodhead are the true dual-analog layouts and are what a
# modern gamepad maps to, so 2.2 is the PORT default -- one physical pad is
# presented as N64 ports 0+1 (right stick looks, left stick moves). Set 1.1 for
# Rare's shipped single-controller scheme.
controls    = 2.2  # Matches MSFT and PS5 controller layout

# --- input preset ----------------------------------------------------------
# The defaults every binding below falls back to. An explicit binding always
# beats it, so start from whichever is closer and change only what you want.
#   modern  WASD + mouse. Right button aims, E interacts, R reloads, C crouches,
#           the wheel changes weapon. On a pad: south interacts, west reloads,
#           east crouches, north cycles weapon.
#   n64     exactly what this port defaulted to before remapping existed --
#           Q aims, R cycles weapon, no reload key, use on the east face button.
input_preset = modern

# Hold or toggle. aim_mode sets GoldenEye's OWN per-player aim-control option,
# which the engine reads as a press rather than a hold. crouch_mode is the
# port's, because the engine has no crouch button to latch.
# In hold mode, RELEASING crouch stands you up.
aim_mode    = hold        # hold | toggle
crouch_mode = hold        # hold | toggle

# --- bindings --------------------------------------------------------------
# Pad values are POSITIONAL: "a" is the bottom face button on every controller,
# whatever it is printed with -- Cross on a DualSense, B on a Switch Pro. Valid:
# a b x y lb rb lt rt start back dup ddown dleft dright lstick rstick none.
# Prefix with p1. .. p4. for one player only: "p2.fire = rb".
# fire   = rt
# aim    = lt
# use    = a
# reload = x
# crouch = b
#
# key.<action> is the keyboard and mouse. Comma-separated; any one fires it.
# SDL names ("Left Ctrl", "Space", "Keypad Enter", "F1") plus mouse1..mouse5,
# wheelup and wheeldown. Short forms lctrl/lshift/lalt/esc/enter work too.
# key.reload      = R
# key.crouch      = C,Left Ctrl
# key.aim         = mouse2
# key.weapon_next = Q,wheelup,Return
# key.weapon_prev = wheeldown
# key.forward     = W
#
# The launcher's Controls page can write all of the above back into this file --
# press SAVE CONTROLS. It rewrites in place and leaves these comments alone.

# --- misc ------------------------------------------------------------------
audio       = 1
# gibs       = explosions # off | explosions | high_damage | always. Default: off.
# unlock_all = 1          # show every mission on the file-select screen
# save_dir   = /path/to/saves

# --- named cheats ----------------------------------------------------------
# These are GoldenEye's OWN cheat flags, exposed BY NAME - not GameShark codes.
# A GameShark code is a raw N64 RDRAM address, and this port has no RDRAM, so the
# published code lists cannot be applied here at all. Driving the game's own cheat
# system instead is layout-independent, ASLR-proof, and still correct after a
# relink or a mod that moves things around. Run --list-cheats for the full set.
# Six take effect straight from this file: dk_mode, infinite_ammo, paintball,
# no_radar, enemy_rockets, extra_mp_chars. The rest set the flag but need to be
# toggled in-game to apply - --list-cheats marks which is which.
# cheats = dk_mode, paintball, infinite_ammo
#
# roster = 64             # full multiplayer character list.
#                         # 8 = default, 64 = cheat. 33 is NOT settable: it is
#                         # derived from the save (complete Cradle on Agent).

# --- Rare's own leftover developer features --------------------------------
# debug_position = 1      # room id + X/Y/Z + compass heading on screen.
#                         # Works in a stock build. Rare's own readout.
# debug_menu     = 1      # NOT a runtime setting - it changes codegen and
#                         # repurposes START. Rebuild instead:
#                         #   GETV_DEBUGMENU=1 ./build_mac.sh lib && ./build_mac.sh app
#                         # Its level select does NOT work (gutted no-ops).
#                         # Use GETV_STAGE = <n> to pick a level.

# --- raw escape hatch ------------------------------------------------------
# Any of the port's ~100 GETV_* development gates can be set by its real name:
# GETV_STAGE = 34
# GETV_EXIT_FRAME = 61
